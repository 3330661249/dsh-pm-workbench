name: Manual Typert network matrix

on:
  workflow_dispatch:
    inputs:
      matrix_set:
        description: Exact closed matrix to resolve and execute
        required: true
        type: choice
        options:
          - selection
          - experimental

permissions:
  contents: read

concurrency:
  group: manual-typert-matrix-${{ github.ref }}-${{ inputs.matrix_set }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve ${{ inputs.matrix_set }} evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: tools/typert-version-matrix/package-lock.json

      - name: Verify exact Node runtime
        run: node --input-type=module -e "if (process.versions.node !== '24.14.0') throw new Error('unexpected Node runtime')"

      - name: Select reviewed matrix configuration
        id: select
        shell: bash
        env:
          REQUESTED_MATRIX: ${{ inputs.matrix_set }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MATRIX" in
            selection)
              matrix_config="tools/typert-version-matrix/config/matrix.official.json"
              ;;
            experimental)
              matrix_config="tools/typert-version-matrix/config/matrix.official-experimental.json"
              ;;
            *)
              echo "Unsupported matrix selection" >&2
              exit 2
              ;;
          esac
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REQUESTED_MATRIX}"
          output=".tmp/dsh-pm-workbench/version-matrix/runs/${run_id}"
          echo "config=${matrix_config}" >> "$GITHUB_OUTPUT"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Install locked matrix-runner dependencies
        working-directory: tools/typert-version-matrix
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked matrix npm CLI
        run: >-
          node tools/typert-version-matrix/node_modules/npm/bin/npm-cli.js
          --version | grep -Fx "11.9.0"

      - name: Check matrix runner offline
        working-directory: tools/typert-version-matrix
        env:
          npm_config_offline: "true"
        run: node node_modules/npm/bin/npm-cli.js run check

      - name: Validate selected config and fixture offline
        env:
          npm_config_offline: "true"
          MATRIX_CONFIG: ${{ steps.select.outputs.config }}
        run: node tools/typert-version-matrix/dist/cli.js validate --matrix "$MATRIX_CONFIG"

      - name: Run resolve-mode network matrix without automatic promotion
        id: matrix
        shell: bash
        env:
          MATRIX_CONFIG: ${{ steps.select.outputs.config }}
          MATRIX_OUTPUT: ${{ steps.select.outputs.output }}
        run: |
          set +e
          node tools/typert-version-matrix/dist/cli.js run \
            --matrix "$MATRIX_CONFIG" \
            --lock-mode resolve \
            --output "$MATRIX_OUTPUT"
          matrix_exit_code="$?"
          set -e
          echo "exit_code=${matrix_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify canonical evidence and captured exit
        id: verify_evidence
        if: ${{ always() && steps.matrix.outcome == 'success' }}
        shell: bash
        env:
          MATRIX_EXIT_CODE: ${{ steps.matrix.outputs.exit_code }}
          MATRIX_OUTPUT: ${{ steps.select.outputs.output }}
        run: |
          set -euo pipefail
          for required in run.json run.final.json matrix.json matrix.md junit.xml; do
            test -f "$MATRIX_OUTPUT/$required" || {
              echo "Missing required evidence file: $required" >&2
              exit 1
            }
          done
          node tools/typert-version-matrix/dist/cli.js \
            verify-report --input "$MATRIX_OUTPUT/matrix.json"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises"
            import path from "node:path"
            import { parseAndVerifyReport } from "./tools/typert-version-matrix/dist/report-json.js"
            import { renderMarkdown } from "./tools/typert-version-matrix/dist/report-markdown.js"
            import { renderJUnit } from "./tools/typert-version-matrix/dist/report-junit.js"
            const output = process.env.MATRIX_OUTPUT
            const expected = Number(process.env.MATRIX_EXIT_CODE)
            if (!output || !Number.isInteger(expected)) throw new Error("captured matrix exit is invalid")
            const runId = path.basename(output)
            const running = JSON.parse(await readFile(path.join(output, "run.json"), "utf8"))
            const final = JSON.parse(await readFile(path.join(output, "run.final.json"), "utf8"))
            const reportJson = await readFile(path.join(output, "matrix.json"), "utf8")
            const verified = parseAndVerifyReport(reportJson)
            if (running.runId !== runId || running.state !== "RUNNING") throw new Error("run marker mismatch")
            if (final.runId !== runId || final.state !== "FINAL" || final.exitCode !== expected) throw new Error("final marker mismatch")
            if (verified.runId !== runId || verified.exitCode !== expected) throw new Error("canonical report exit mismatch")
            if (await readFile(path.join(output, "matrix.md"), "utf8") !== renderMarkdown(verified)) throw new Error("Markdown view mismatch")
            if (await readFile(path.join(output, "junit.xml"), "utf8") !== renderJUnit(verified)) throw new Error("JUnit view mismatch")
          '

      - name: Upload allowlisted evidence
        if: ${{ always() && steps.verify_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typert-matrix-evidence-${{ inputs.matrix_set }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.select.outputs.output }}/run.json
            ${{ steps.select.outputs.output }}/run.final.json
            ${{ steps.select.outputs.output }}/matrix.json
            ${{ steps.select.outputs.output }}/matrix.md
            ${{ steps.select.outputs.output }}/junit.xml
            ${{ steps.select.outputs.output }}/cases/*/proposed-lock/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          overwrite: false

      - name: Enforce conclusive exit semantics without recommending a version
        if: ${{ always() && steps.matrix.outcome == 'success' && steps.verify_evidence.outcome == 'success' }}
        shell: bash
        env:
          MATRIX_EXIT_CODE: ${{ steps.matrix.outputs.exit_code }}
          REQUESTED_MATRIX: ${{ inputs.matrix_set }}
        run: |
          set -euo pipefail
          case "${REQUESTED_MATRIX}:${MATRIX_EXIT_CODE}" in
            selection:0|selection:1|experimental:1)
              echo "Evidence run completed; human review remains required."
              ;;
            *)
              echo "Matrix evidence is incomplete or violates the selected decision mode." >&2
              exit 1
              ;;
          esac
