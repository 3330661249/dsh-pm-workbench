name: Manual Typert network matrix

on:
  workflow_dispatch:
    inputs:
      matrix_set:
        description: Exact closed matrix to resolve and execute
        required: true
        type: choice
        options:
          - selection
          - experimental

permissions:
  contents: read

concurrency:
  group: manual-typert-matrix-${{ github.ref }}-${{ inputs.matrix_set }}
  cancel-in-progress: false

jobs:
  resolve-matrix:
    name: Resolve ${{ inputs.matrix_set }} evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up exact Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: tools/typert-version-matrix/package-lock.json

      - name: Verify exact Node runtime
        run: node --input-type=module -e "if (process.versions.node !== '24.14.0') throw new Error('unexpected Node runtime')"

      - name: Select reviewed matrix configuration
        id: select
        shell: bash
        env:
          REQUESTED_MATRIX: ${{ inputs.matrix_set }}
        run: |
          set -euo pipefail
          case "$REQUESTED_MATRIX" in
            selection)
              matrix_config="tools/typert-version-matrix/config/matrix.official.json"
              ;;
            experimental)
              matrix_config="tools/typert-version-matrix/config/matrix.official-experimental.json"
              ;;
            *)
              echo "Unsupported matrix selection" >&2
              exit 2
              ;;
          esac
          run_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${REQUESTED_MATRIX}"
          output=".tmp/dsh-pm-workbench/version-matrix/runs/${run_id}"
          echo "config=${matrix_config}" >> "$GITHUB_OUTPUT"
          echo "output=${output}" >> "$GITHUB_OUTPUT"

      - name: Install locked matrix-runner dependencies
        working-directory: tools/typert-version-matrix
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify locked matrix npm CLI
        run: >-
          node tools/typert-version-matrix/node_modules/npm/bin/npm-cli.js
          --version | grep -Fx "11.9.0"

      - name: Check matrix runner offline
        working-directory: tools/typert-version-matrix
        env:
          npm_config_offline: "true"
        run: node node_modules/npm/bin/npm-cli.js run check

      - name: Validate selected config and fixture offline
        env:
          npm_config_offline: "true"
          MATRIX_CONFIG: ${{ steps.select.outputs.config }}
        run: node tools/typert-version-matrix/dist/cli.js validate --matrix "$MATRIX_CONFIG"

      - name: Run resolve-mode network matrix without automatic promotion
        id: matrix
        shell: bash
        env:
          MATRIX_CONFIG: ${{ steps.select.outputs.config }}
          MATRIX_OUTPUT: ${{ steps.select.outputs.output }}
        run: |
          set +e
          node tools/typert-version-matrix/dist/cli.js run \
            --matrix "$MATRIX_CONFIG" \
            --lock-mode resolve \
            --output "$MATRIX_OUTPUT"
          matrix_exit_code="$?"
          set -e
          echo "exit_code=${matrix_exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload allowlisted raw evidence
        if: ${{ always() && steps.select.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typert-matrix-raw-${{ inputs.matrix_set }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.select.outputs.output }}/run.json
            ${{ steps.select.outputs.output }}/run.final.json
            ${{ steps.select.outputs.output }}/matrix.json
            ${{ steps.select.outputs.output }}/matrix.md
            ${{ steps.select.outputs.output }}/junit.xml
            ${{ steps.select.outputs.output }}/cases/*/evidence.json
            ${{ steps.select.outputs.output }}/cases/*/report.md
            ${{ steps.select.outputs.output }}/cases/*/logs/**
            ${{ steps.select.outputs.output }}/cases/*/proposed-lock/**
            ${{ steps.select.outputs.output }}/cases/*/workspace/packages/probe/lib/typert.*
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          compression-level: 6
          overwrite: false

      - name: Enforce conclusive exit semantics without recommending a version
        if: ${{ always() && steps.matrix.outcome == 'success' }}
        shell: bash
        env:
          MATRIX_EXIT_CODE: ${{ steps.matrix.outputs.exit_code }}
          REQUESTED_MATRIX: ${{ inputs.matrix_set }}
        run: |
          set -euo pipefail
          case "${REQUESTED_MATRIX}:${MATRIX_EXIT_CODE}" in
            selection:0|selection:1|experimental:1)
              echo "Evidence run completed; human review remains required."
              ;;
            *)
              echo "Matrix evidence is incomplete or violates the selected decision mode." >&2
              exit 1
              ;;
          esac
